# orchestrator/docker-compose.yml
# Standalone n8n + Postgres stack for orchestrator development.
# For full-stack (all services), use the root docker-compose.yml instead.
#
# Usage:
#   cd orchestrator/
#   docker compose --env-file ../.env up -d

version: "3.9"

services:
  # ── Postgres (shared with root stack via external network) ──────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scraper_db}
      POSTGRES_USER: ${POSTGRES_USER:-scraper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Initialize both the scraper schema AND the n8n database
      - ../shared/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./init/02_n8n_db.sql:/docker-entrypoint-initdb.d/02_n8n_db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scraper}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── n8n Workflow Orchestrator ────────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      # Auth
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-true}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-change_me}
      # Database — n8n stores its own execution history in Postgres
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n_db}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-scraper}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      # Webhook base URL (update for production)
      WEBHOOK_URL: http://localhost:${N8N_PORT:-5678}/
      # Timezone
      GENERIC_TIMEZONE: ${TZ:-America/New_York}
      # Custom nodes path inside container
      N8N_CUSTOM_EXTENSIONS: /home/node/.n8n/custom
      # Allow community nodes
      N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE: "true"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # n8n data (encryption key, settings, credentials)
      - n8n_data:/home/node/.n8n
      # Custom nodes (built from orchestrator/custom-nodes/)
      - ./custom-nodes:/home/node/.n8n/custom:ro

volumes:
  postgres_data:
  n8n_data:
